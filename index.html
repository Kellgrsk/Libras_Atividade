<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CADASTRO</h1>
        <fieldset>
            <legend>Endereço</legend>
            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome">
            <br>
            <label for="nome">Sobrenome:</label>
            <br>
            <input type="text" id="sobrenome">
            <br>
            <label for="nome">RG:</label>
            <br>
            <input type="text" id="rg">
            <br>
            <label for="nome">Data de Nascimento:</label>
            <br>
            <input type="text" id="data de nascimento">
            <br>
            <label for="nome">Estado Civil:</label>
            <br>
            <input type="text" id="estado civil">
            <br>
            <label for="nome">CPF</label>
            <br>
            <input type="text" id="cpf">
            <br>
            <label for="nome">Escolaridade</label>
            <br>
            <input type="text" id="escolaridade">
            <br>
            <label for="">E-mail</label>
            <br>
            <input type="text" id="e-mail">
            <br>
            <label for="cep">Telefone:</label>
            <br>
            <input type="text" id="telefone">
            <br>
            <label for="cep">CEP:</label>
            <br>
            <input type="text" id="cep" autocomplete="off">
            <br>
            <label for="nome">Número da Casa:</label>
            <br>
            <input type="text" id="número da casa">
            <br>
            <label for="rua">Rua:</label>
            <br>
            <input type="text" id="rua" readonly>
            <br>
            <label for="numero">Número:</label>
            <br>
            <input type="text" id="numero">
            <br>
            <label for="bairro">Bairro:</label>
            <br>
            <input type="text" id="bairro" readonly>
            <br>
            <label for="cidade">Cidade:</label>
            <br>
            <input type="text" id="cidade" readonly>
            <br>
            <label for="estado">Estado:</label>
            <br>
            <input type="text" id="estado" readonly>
            <br>
            <label for="região">Região</label>
            <br>
            <input type="text" id="região" readonly>
            <br>
            <label for="ddd">DDD</label>
            <br>
            <input type="text" id="ddd" readonly>
    <br>
</body>
<script>
    //preencher os inputs com arrow functions
    const preencherFormulario = (endereco) => {
    document.getElementById("rua").value = endereco.logradouro;
    document.getElementById("bairro").value = endereco.bairro;
    document.getElementById("cidade").value = endereco.localidade;
    document.getElementById("estado").value = endereco.uf;
    document.getElementById("região").value = endereco.regiao
    document.getElementById("ddd").value = endereco.ddd

}
//autopreenchimento
const cepValido = (cep) => {
    if (cep.length == 8) {
        return true;
    } else {
        return false;
    }
}
//buscar API
const pesquisarCep = async () => {
    const cep = document.getElementById("cep").value;
    const url = `http://viacep.com.br/ws/${cep}/json/`;
    const erroElemento = document.getElementById("erro-cep");
    if (cepValido(cep)) {
        const dados = await fetch(url);
        const endereco = await dados.json();
            preencherFormulario(endereco);
        }
}
document.getElementById("cep").addEventListener("focusout", pesquisarCep);
</script>
</html>
